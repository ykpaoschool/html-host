{% extends "app_layout.html" %}
{% block main %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ 'edit_user' | t }}</h1>

    <div class="bg-white rounded-2xl border border-gray-100 p-6">
        <form method="POST">
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'display_name' | t }}</label>
                <input type="text" name="display_name" value="{{ edit_user.display_name }}" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-400 focus:ring-2 focus:ring-purple-100 outline-none transition">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'email' | t }}</label>
                <input type="email" value="{{ edit_user.email }}" disabled
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'password' | t }} ({{ 'cancel' | t }})</label>
                <input type="password" name="password"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-400 focus:ring-2 focus:ring-purple-100 outline-none transition"
                    placeholder="Leave blank to keep current password">
            </div>
            <div class="mb-6">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_admin" {{ 'checked' if edit_user.is_admin }} class="w-5 h-5 rounded text-purple-600 focus:ring-purple-400">
                    <span class="text-sm font-medium text-gray-700">{{ 'is_admin' | t }}</span>
                </label>
            </div>
            <div class="flex gap-3 justify-end">
                <a href="{{ url_for('admin.index') }}"
                    class="px-4 py-2 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition">{{ 'cancel' | t }}</a>
                <button type="submit"
                    class="px-4 py-2 rounded-xl text-white text-sm font-semibold gradient-btn transition">{{ 'save' | t }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

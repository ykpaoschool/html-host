<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.name }} - HTMLHost</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .toolbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            flex-shrink: 0;
        }
        .toolbar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 12px; }
        .toolbar a:hover { color: white; }
        iframe { flex: 1; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:600;">{{ file.name }}</span>
        </div>
        <a href="/">HTMLHost</a>
    </div>
    <iframe srcdoc="{{ content | e }}" sandbox="allow-scripts allow-same-origin"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLHost</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .toolbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            flex-shrink: 0;
        }
        .toolbar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 12px; }
        .toolbar a:hover { color: white; }
        .download-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .download-btn:hover { background: rgba(255,255,255,0.3); color: white; }
        iframe { flex: 1; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="toolbar">
        <span>{{ uploaded_by }}</span>
        <div style="display:flex;align-items:center;gap:12px;">
            <a href="/s/{{ link.token }}/download" class="download-btn">{{ "download" | t }}</a>
            <a href="/">HTMLHost</a>
        </div>
    </div>
    <iframe srcdoc="{{ content | e }}" sandbox="allow-scripts allow-same-origin"></iframe>
</body>
</html>
